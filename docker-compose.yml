services:
  prima-ratio:
    image: ${PRIMA_IMAGE:-ghcr.io/andrea-tomassi/prima-ratio:latest}
    container_name: prima-ratio
    ports:
      - "8000:8000"
      - "10000:8000"          # second port kept for the reverse-proxy route
    environment:
      - PRIMA_GGUF=/models/gemma-4-12b-it-UD-Q6_K_XL.gguf
      - PRIMA_MMPROJ=/models/mmproj-F16.gguf        # optional: enables vision
      - PRIMA_LLAMA_GPU_LAYERS=-1
      - PRIMA_MAX_TOKENS=150000                     # scoring context budget
      - PRIMA_KV_TYPE_K=q8_0
      - PRIMA_KV_TYPE_V=q8_0
      - PRIMA_SWA_FULL=0                            # window-sized SWA: 100K+ contexts fit
      - PRIMA_PARALLEL=1
      - PRIMA_CHAT_TOKENS=200000                    # total chat context, split by PRIMA_PARALLEL
      - PRIMA_MODEL_NAME=prima-ratio-gemma4-12b
      - HF_HOME=/cache/huggingface
      - PRIMA_MANIFEST=/app/build/calibration-manifest.json
    volumes:
      - ${HF_CACHE_DIR:-${HOME}/.cache/huggingface}:/cache/huggingface
      - ./build:/app/build                       # calibration manifest lives here
      - ${GGUF_DIR:-./models}:/models:ro         # your .gguf + projector
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
