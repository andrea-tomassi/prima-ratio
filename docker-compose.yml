services:
  semif-server:
    # torch variant (Qwen3.5-4B bf16):   ghcr.io/andrea-tomassi/semif-server:latest
    # GGUF variant (llama.cpp + local .gguf): ghcr.io/andrea-tomassi/semif-server:gguf
    image: ${SEMIF_IMAGE:-ghcr.io/andrea-tomassi/semif-server:latest}
    container_name: semif-server
    ports:
      - "8000:8000"
      - "10000:8000"          # second port kept for the reverse-proxy route
    environment:
      - HF_HOME=/cache/huggingface
      - SEMIF_MANIFEST=/app/build/calibration-manifest.json
      # GGUF variant only (image tag :gguf, defaults already baked: backend
      # llamacpp + full GPU offload) — point it at the mounted model:
      # - SEMIF_GGUF=/models/gemma-4-12b-it-UD-Q6_K_XL.gguf
      # - SEMIF_LLAMA_GPU_LAYERS=-1
      # - SEMIF_MODEL_NAME=semif-gemma4-12b
      # - SEMIF_MMPROJ=/models/mmproj-F16.gguf   # vision (chat + decisions)
      # - SEMIF_MAX_TOKENS=150000                # long context
      # - SEMIF_KV_TYPE_K=q8_0
      # - SEMIF_KV_TYPE_V=q8_0                   # q8 KV: half memory + flash attention
      # - SEMIF_SWA_FULL=0                       # window-sized SWA cache (100K+ on 16 GB)
    volumes:
      - ${HF_CACHE_DIR:-${HOME}/.cache/huggingface}:/cache/huggingface
      - ./build:/app/build                       # calibration manifest lives here
      - ${GGUF_DIR:-./models}:/models:ro         # GGUF variant: model directory
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
