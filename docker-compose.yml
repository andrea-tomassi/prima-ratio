services:
  prima-ratio:
    image: ghcr.io/andrea-tomassi/prima-ratio:latest
    build: .
    ports:
      - "8000:8000"
    gpus: all
    volumes:
      - prima-cache:/cache
    environment:
      PRIMA_CTX: "40960"
      # PRIMA_EXTRA_ARGS: "--api-key change-me"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${PRIMA_PORT:-8000}/health >/dev/null"]
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 3

volumes:
  prima-cache:
