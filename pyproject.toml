[project]
name = "prima-ratio"
version = "0.3.0"
description = "A local, single-model System One endpoint: typed decisions with calibrated probabilities, chat and vision on one GPU."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.121.0",
  "uvicorn==0.54.0",
  "llama-cpp-python==0.3.35",
  "transformers==5.17.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
include = ["prima_ratio*"]
