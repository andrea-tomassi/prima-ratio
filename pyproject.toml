[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prima-ratio"
version = "2.0.1"
description = "Turn-key System One decision service — typed decisions with calibrated probabilities and vision, in one Docker container"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.11",
    "torchvision",
    "transformers>=5.10",
    "bitsandbytes>=0.45",
    "accelerate",
    "safetensors",
    "huggingface_hub",
    "pillow",
    "fastapi",
    "uvicorn",
]

[tool.setuptools.packages.find]
include = ["prima_ratio*"]
